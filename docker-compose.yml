# Distributed 10-K / 10-Q extraction worker.
#
# Networking: same as earning_scraping_agent worker.
#   MongoDB — joins backend_true_grids_backend_network (shared with admin_backend)
#   Redis   — reaches admin_backend's Redis via host port 6379
#
# Usage:
#   docker compose up -d          # first time (or after dep / Dockerfile changes)
#   docker compose up -d --build  # after pyproject.toml / uv.lock changes
#   docker compose restart worker-10kq  # after any code change (no rebuild needed)
#   docker compose logs -f worker-10kq

services:
  worker-10kq:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL:              redis://host.docker.internal:6379/0
      REDIS_QUEUE_NAME:       sec:filings:10kq
      MONGODB_URI:            mongodb://mongo:27017/?directConnection=true
      DATABASE_NAME:          normalize_data
      SEC_HTML_DOWNLOAD_PATH: /app/sec_html_filings
      PYTHONUNBUFFERED:       "1"
      # Suppress uv hardlink warning when cache and target are on different
      # filesystems (Docker volume vs container layer).
      UV_LINK_MODE:           copy
    volumes:
      # Mount source so code edits are reflected without rebuilding the image.
      # uv sync installs the project in editable mode, so Python reads from
      # this mount at runtime.  After editing, run:
      #   docker compose restart worker-10kq
      - .:/app
      # Preserve the .venv built during the image build so the host mount
      # above doesn't hide it.
      - /app/.venv
      # SEC HTML filing downloads (persistent across restarts)
      - /Users/aijaz/sec_html_filings:/app/sec_html_filings
    restart: unless-stopped
    networks:
      - backend_true_grids_backend_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  backend_true_grids_backend_network:
    external: true
